# Tiny NAFNet train config: tiny_lr1e3

name: NAFNet-SIDL-all-tiny-width4-lr1e3-es20000-v1
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 42

datasets:
  train:
    name: sidl-all-train-inner
    type: PairedImageDataset
    dataroot_gt: /data/donggyun/SIDL_project/data_full/train/all_custom_train_inner/target
    dataroot_lq: /data/donggyun/SIDL_project/data_full/train/all_custom_train_inner/input
    io_backend:
      type: disk
    gt_size: 64
    use_flip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8

  val:
    name: sidl-all-es-val-inner
    type: PairedImageDataset
    dataroot_gt: /data/donggyun/SIDL_project/data_full/train/all_custom_es_val_inner/target
    dataroot_lq: /data/donggyun/SIDL_project/data_full/train/all_custom_es_val_inner/input
    io_backend:
      type: disk

network_g:
  type: NAFNetLocal
  width: 4
  enc_blk_nums: [1, 1, 1, 1]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: !!float 1e-3
    betas: [0.9, 0.9]
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 20000
    eta_min: !!float 1e-7
  total_iter: 20000
  warmup_iter: -1
  pixel_opt:
    type: PSNRLoss
    loss_weight: 1
    reduction: mean

val:
  val_freq: 1000
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: 1000
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
